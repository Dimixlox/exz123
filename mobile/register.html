<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конференции.РФ — Регистрация</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .phone { width: 390px; height: 844px; background: #f5f7ff; border-radius: 48px; box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 0 0 2px #444; overflow: hidden; display: flex; flex-direction: column; }

    .status-bar { background: #1e3a8a; padding: 14px 28px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .status-bar .time { color: white; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; gap: 6px; }
    .status-icons i { color: white; font-size: 13px; }

    .topbar { background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 16px 24px 20px; display: flex; align-items: center; gap: 14px; }
    .back-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; color: white; font-size: 18px; text-decoration: none; }
    .topbar-title { color: white; font-size: 18px; font-weight: 700; }
    .topbar-sub { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 2px; }

    .content { flex: 1; overflow-y: auto; padding: 20px 24px 24px; }
    .content::-webkit-scrollbar { display: none; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.05em; }

    .input-wrap { display: flex; align-items: center; background: white; border-radius: 14px; border: 2px solid #e2e8f0; transition: all 0.2s; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .input-wrap:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
    .input-wrap i { padding: 13px 12px 13px 14px; color: #94a3b8; font-size: 17px; }
    .input-wrap input { flex: 1; border: none; background: transparent; padding: 13px 14px 13px 0; font-size: 14px; font-family: inherit; color: #1e293b; outline: none; }

    .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; padding-left: 4px; }
    .hint.error { color: #ef4444; }

    .section-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 16px; }
    .section-divider span { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

    .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 6px; box-shadow: 0 8px 20px rgba(37,99,235,0.35); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-primary:active { transform: scale(0.98); }

    .footer-text { text-align: center; font-size: 13px; color: #64748b; margin-top: 16px; }
    .footer-text a { color: #2563eb; font-weight: 600; text-decoration: none; }

    .progress-bar { display: flex; gap: 6px; margin-bottom: 20px; }
    .progress-step { flex: 1; height: 4px; border-radius: 4px; background: #e2e8f0; }
    .progress-step.active { background: #3b82f6; }
    .progress-step.done { background: #10b981; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons"><i class="bi bi-wifi"></i><i class="bi bi-reception-4"></i><i class="bi bi-battery-full"></i></div>
    </div>

    <div class="topbar">
      <a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i></a>
      <div>
        <div class="topbar-title">Регистрация</div>
        <div class="topbar-sub">Создайте аккаунт</div>
      </div>
    </div>

    <div class="content">
      <div class="progress-bar">
        <div class="progress-step done"></div>
        <div class="progress-step active"></div>
        <div class="progress-step"></div>
      </div>

      <div class="field">
        <label><i class="bi bi-at"></i> Логин</label>
        <div class="input-wrap">
          <i class="bi bi-person"></i>
          <input type="text" placeholder="Только латиница и цифры">
        </div>
        <div class="hint">Минимум 6 символов, только a–z и 0–9</div>
      </div>

      <div class="field">
        <label><i class="bi bi-lock"></i> Пароль</label>
        <div class="input-wrap">
          <i class="bi bi-shield-lock"></i>
          <input type="password" placeholder="Минимум 8 символов">
        </div>
        <div class="hint error" style="display:none"><i class="bi bi-exclamation-circle"></i> Пароль слишком короткий</div>
      </div>

      <div class="section-divider"><span>Персональные данные</span></div>

      <div class="field">
        <label><i class="bi bi-person-badge"></i> ФИО</label>
        <div class="input-wrap">
          <i class="bi bi-person-lines-fill"></i>
          <input type="text" placeholder="Иванов Иван Иванович">
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-telephone"></i> Телефон</label>
        <div class="input-wrap">
          <i class="bi bi-phone"></i>
          <input type="tel" placeholder="+7 (999) 000-00-00">
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-envelope"></i> E-mail</label>
        <div class="input-wrap">
          <i class="bi bi-at"></i>
          <input type="email" placeholder="example@mail.ru">
        </div>
      </div>

      <button class="btn-primary">
        <i class="bi bi-person-plus"></i> Зарегистрироваться
      </button>

      <div class="footer-text">
        Уже есть аккаунт? <a href="index.html">Войти</a>
      </div>
    </div>
  </div>
</body>
</html>
