<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конференции.РФ — Заявка</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .phone { width: 390px; height: 844px; background: #f0f4ff; border-radius: 48px; box-shadow: 0 40px 100px rgba(0,0,0,0.5), inset 0 0 0 2px #444; overflow: hidden; display: flex; flex-direction: column; }

    .status-bar { background: #1e3a8a; padding: 14px 28px 10px; display: flex; justify-content: space-between; flex-shrink: 0; }
    .status-bar .time { color: white; font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; gap: 6px; }
    .status-icons i { color: white; font-size: 13px; }

    .topbar { background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 16px 24px 22px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .back-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: white; font-size: 18px; flex-shrink: 0; }
    .topbar-info { }
    .topbar-title { color: white; font-size: 18px; font-weight: 700; }
    .topbar-sub { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 2px; }

    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .content::-webkit-scrollbar { display: none; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }

    .select-wrap { position: relative; }
    .select-wrap select { width: 100%; padding: 14px 44px 14px 16px; background: white; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 14px; font-family: inherit; color: #1e293b; outline: none; appearance: none; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: border-color 0.2s; }
    .select-wrap select:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
    .select-wrap i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; pointer-events: none; }

    .input-wrap { display: flex; align-items: center; background: white; border-radius: 14px; border: 2px solid #e2e8f0; transition: all 0.2s; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .input-wrap:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
    .input-wrap i { padding: 14px 12px 14px 14px; color: #94a3b8; font-size: 17px; }
    .input-wrap input, .input-wrap textarea { flex: 1; border: none; background: transparent; padding: 14px 14px 14px 0; font-size: 14px; font-family: inherit; color: #1e293b; outline: none; }
    .input-wrap textarea { resize: none; min-height: 70px; }

    /* Карточки помещений */
    .room-cards { display: flex; flex-direction: column; gap: 10px; }
    .room-card { background: white; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border: 2px solid #e2e8f0; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .room-card.selected { border-color: #3b82f6; background: #eff6ff; }
    .room-card img { width: 60px; height: 50px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .room-card-info h4 { font-size: 13px; font-weight: 600; color: #1e293b; }
    .room-card-info p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .room-card .check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #e2e8f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .room-card.selected .check { background: #3b82f6; border-color: #3b82f6; }
    .room-card.selected .check i { color: white; font-size: 12px; }

    .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 8px 20px rgba(37,99,235,0.35); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; margin-top: 4px; }
    .btn-primary:active { transform: scale(0.98); }

    .info-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; margin-bottom: 16px; }
    .info-box i { color: #3b82f6; font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .info-box p { font-size: 12px; color: #1e40af; line-height: 1.5; }

    .section-label { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons"><i class="bi bi-wifi"></i><i class="bi bi-reception-4"></i><i class="bi bi-battery-full"></i></div>
    </div>

    <div class="topbar">
      <a href="dashboard.html" class="back-btn"><i class="bi bi-arrow-left"></i></a>
      <div class="topbar-info">
        <div class="topbar-title">Новая заявка</div>
        <div class="topbar-sub">Бронирование помещения</div>
      </div>
    </div>

    <div class="content">

      <div class="section-label">Выберите помещение</div>
      <div class="room-cards" style="margin-bottom:18px">
        <div class="room-card selected">
          <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=200&auto=format&fit=crop" alt="">
          <div class="room-card-info">
            <h4>Аудитория №1</h4>
            <p>До 100 чел. · 5 000 ₽/ч</p>
          </div>
          <div class="check"><i class="bi bi-check-lg"></i></div>
        </div>
        <div class="room-card">
          <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=200&auto=format&fit=crop" alt="">
          <div class="room-card-info">
            <h4>Коворкинг «Инновации»</h4>
            <p>До 50 чел. · 3 000 ₽/ч</p>
          </div>
          <div class="check"></div>
        </div>
        <div class="room-card">
          <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=200&auto=format&fit=crop" alt="">
          <div class="room-card-info">
            <h4>Кинозал «Панорама»</h4>
            <p>До 200 чел. · 8 000 ₽/ч</p>
          </div>
          <div class="check"></div>
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-calendar3"></i> Дата конференции</label>
        <div class="input-wrap">
          <i class="bi bi-calendar-event"></i>
          <input type="date" value="2026-06-15">
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-credit-card"></i> Способ оплаты</label>
        <div class="select-wrap">
          <select>
            <option>— Выберите способ оплаты —</option>
            <option selected>Банковская карта</option>
            <option>Наличные</option>
            <option>Безналичный расчёт</option>
          </select>
          <i class="bi bi-chevron-down"></i>
        </div>
      </div>

      <div class="field">
        <label><i class="bi bi-chat-left-text"></i> Примечания</label>
        <div class="input-wrap">
          <textarea placeholder="Дополнительные пожелания..."></textarea>
        </div>
      </div>

      <div class="info-box">
        <i class="bi bi-info-circle"></i>
        <p>Заявка будет рассмотрена администратором. Статус можно отследить в личном кабинете.</p>
      </div>

      <button class="btn-primary">
        <i class="bi bi-send"></i> Подать заявку
      </button>
    </div>
  </div>
</body>
</html>
