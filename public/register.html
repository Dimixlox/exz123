<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конференции.РФ — Регистрация</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:520px">
      <div class="auth-logo">
        <div class="logo-icon">
          <i class="bi bi-building"></i>
        </div>
        <h1>Конференции.РФ</h1>
        <p>Создайте аккаунт для бронирования</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="login">
            <i class="bi bi-at"></i> Логин
          </label>
          <input type="text" id="login" class="form-control"
            placeholder="Латинские буквы и цифры, мин. 6 символов"
            autocomplete="username">
          <div style="font-size:.78rem;color:var(--text-muted);margin-top:.35rem">
            <i class="bi bi-info-circle"></i> Только латинские буквы (a–z, A–Z) и цифры, от 6 символов
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="bi bi-lock"></i> Пароль
          </label>
          <input type="password" id="password" class="form-control"
            placeholder="Не менее 8 символов"
            autocomplete="new-password">
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label" for="fullName">
            <i class="bi bi-person-badge"></i> ФИО
          </label>
          <input type="text" id="fullName" class="form-control"
            placeholder="Иванов Иван Иванович"
            autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">
            <i class="bi bi-telephone"></i> Телефон
          </label>
          <input type="tel" id="phone" class="form-control"
            placeholder="+7 (999) 000-00-00"
            autocomplete="tel">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            <i class="bi bi-envelope"></i> E-mail
          </label>
          <input type="email" id="email" class="form-control"
            placeholder="example@mail.ru"
            autocomplete="email">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block mt-2">
          <i class="bi bi-person-plus"></i> Зарегистрироваться
        </button>
      </form>

      <!-- Блок успеха -->
      <div id="successBlock" class="hidden" style="text-align:center;padding:1.5rem 0">
        <div style="font-size:4rem;color:var(--success);margin-bottom:1rem">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h3 style="margin-bottom:.5rem">Регистрация прошла успешно!</h3>
        <p class="text-muted">Перенаправляем в личный кабинет...</p>
        <div class="mt-2"><span class="spinner dark"></span></div>
      </div>

      <div class="auth-footer">
        Уже зарегистрированы?
        <a href="/index.html" class="link-primary">Войти</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
