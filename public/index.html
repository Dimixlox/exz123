<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конференции.РФ — Вход</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">
          <i class="bi bi-building"></i>
        </div>
        <h1>Конференции.РФ</h1>
        <p>Портал бронирования помещений</p>
      </div>

      <div id="globalError" class="alert alert-danger hidden"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="login">
            <i class="bi bi-person"></i> Логин
          </label>
          <input type="text" id="login" class="form-control" placeholder="Введите логин" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="bi bi-lock"></i> Пароль
          </label>
          <input type="password" id="password" class="form-control" placeholder="Введите пароль" autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block mt-2">
          <i class="bi bi-box-arrow-in-right"></i> Войти
        </button>
      </form>

      <div class="auth-footer">
        Ещё не зарегистрированы?
        <a href="/register.html" class="link-primary">Регистрация</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
