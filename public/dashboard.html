<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конференции.РФ — Личный кабинет</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">
      <div class="brand-icon"><i class="bi bi-building"></i></div>
      <span>Конференции.РФ</span>
    </a>
    <div class="navbar-right">
      <div class="user-badge">
        <i class="bi bi-person-circle"></i>
        <span id="userName"></span>
      </div>
      <a href="/booking.html" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle"></i> Новая заявка
      </a>
      <button id="logoutBtn" class="btn btn-outline btn-sm">
        <i class="bi bi-box-arrow-right"></i> Выйти
      </button>
    </div>
  </nav>

  <div class="container page-content">

    <!-- Слайдер помещений -->
    <div class="section-header">
      <div class="section-title">
        <i class="bi bi-grid-3x3-gap"></i> Доступные помещения
      </div>
    </div>

    <div class="swiper" id="roomSwiper">
      <div class="swiper-wrapper" id="swiperWrapper">
        <!-- Заполняется JS -->
      </div>
      <div class="swiper-pagination"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>

    <!-- Мои заявки -->
    <div class="section-header">
      <div class="section-title">
        <i class="bi bi-list-check"></i> Мои заявки
        <span id="bookingsCount" style="font-size:.9rem;font-weight:500;color:var(--text-muted);margin-left:.5rem"></span>
      </div>
      <a href="/booking.html" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle"></i> Создать заявку
      </a>
    </div>

    <div id="bookingsList" class="bookings-grid">
      <div class="empty-state"><span class="spinner dark"></span></div>
    </div>
  </div>

  <!-- Модальное окно отзыва -->
  <div id="reviewModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="bi bi-star" style="color:var(--warning)"></i> Оставить отзыв</h3>
        <button id="closeReviewModal" class="modal-close"><i class="bi bi-x-lg"></i></button>
      </div>

      <div class="form-group">
        <label class="form-label">Ваша оценка</label>
        <div class="star-rating">
          <button class="star-btn" data-star="1">★</button>
          <button class="star-btn" data-star="2">★</button>
          <button class="star-btn" data-star="3">★</button>
          <button class="star-btn" data-star="4">★</button>
          <button class="star-btn" data-star="5">★</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reviewText">Ваш отзыв</label>
        <textarea id="reviewText" class="form-control" rows="4"
          placeholder="Поделитесь впечатлениями о мероприятии..."
          style="resize:vertical"></textarea>
      </div>

      <div class="modal-footer">
        <button id="closeReviewModal2" class="btn btn-outline" onclick="document.getElementById('reviewModal').classList.add('hidden')">
          Отмена
        </button>
        <button id="submitReviewBtn" class="btn btn-primary">
          <i class="bi bi-send"></i> Отправить
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
